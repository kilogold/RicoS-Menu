name: Menu catalog version

on:
  push:
    branches: [main, preview]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RicoS-Menu
        uses: actions/checkout@v5
        with:
          path: RicoS-Menu
          fetch-depth: 0

      - name: Checkout RicoS shared parser
        uses: actions/checkout@v5
        with:
          repository: kilogold/RicoS
          path: RicoS
          fetch-depth: 1
          sparse-checkout: |
            packages/shared
          sparse-checkout-cone-mode: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Fetch pre-push commit
        if: github.event.before != '0000000000000000000000000000000000000000'
        working-directory: RicoS-Menu
        run: git fetch --no-tags --depth=1 origin ${{ github.event.before }}

      - name: Verify menu catalog version bump
        working-directory: RicoS-Menu
        env:
          MENU_CATALOG_BASE_REF: ${{ github.event.before }}
        run: bun scripts/verify-menu-catalog-version.mjs

      - name: Revalidate RicoS menu cache
        if: success()
        working-directory: RicoS-Menu
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MENU_CATALOG_BASE_REF: ${{ github.event.before }}
          RICOS_PREVIEW_REVALIDATE_URL: ${{ secrets.RICOS_PREVIEW_REVALIDATE_URL }}
          RICOS_PRODUCTION_REVALIDATE_URL: ${{ secrets.RICOS_PRODUCTION_REVALIDATE_URL }}
          RICOS_VERCEL_PROTECTION_BYPASS: ${{ secrets.RICOS_VERCEL_PROTECTION_BYPASS }}
        run: bun scripts/trigger-menu-revalidate.mjs
